# kind cluster definition for Aegis Phase 1.
# kind = Kubernetes IN Docker. One Docker container becomes a single-node cluster.
# extraPortMappings: traffic to your Windows localhost is forwarded into the node,
# then to NodePort Services (WSO2 consoles and gateway).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegis
nodes:
  - role: control-plane
    extraPortMappings:
      # WSO2 Carbon / Publisher / DevPortal / Admin (HTTPS)
      - containerPort: 30443
        hostPort: 9443
        protocol: TCP
      # WSO2 API Gateway HTTPS
      - containerPort: 30243
        hostPort: 8243
        protocol: TCP
      # WSO2 API Gateway HTTP
      - containerPort: 30280
        hostPort: 8280
        protocol: TCP
      # Direct payment-api (debug only — clients should use the gateway)
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
